schema_version: 1

context:
  version: "5.0.0"
  sha256: 8d111098198d9e43d606bd13f66b09316bde941a69e1d973921ee741b7a7249a

package:
  name: cargo-bundle-licenses
  version: ${{ version }}

source:
  url: https://github.com/sstadick/cargo-bundle-licenses/archive/v${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - cargo-auditable

tests:
  - script:
      - cargo-bundle-licenses --help

about:
  license: MIT
  license_file: LICENSE-MIT
  summary: Bundle thirdparty licenses for Cargo projects into a single file.
  homepage: https://github.com/sstadick/cargo-bundle-licenses

extra:
  recipe-maintainers:
    - sstadick
    - xhochy
